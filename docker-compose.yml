services:
  app:
    build:
      context: .
      args:
        PIP_INDEX_URL: ${BUILD_PIP_INDEX_URL:-https://pypi.org/simple}
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://huiyang:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db:5432/huiyang
      ENV_PATH: /root/huiyang/.env
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./.env:/root/huiyang/.env:ro
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: huiyang
      POSTGRES_USER: huiyang
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U huiyang -d huiyang"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
